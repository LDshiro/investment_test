run:
  name: default
  mode: backtest              # backtest | shadow | live_dryrun | live
  timezone: Asia/Tokyo
  seed: 42
  write_daily_packet: true
  runs_root: ./runs
  logs_root: ./logs

calendar:
  mode: paper_mode            # paper_mode | robust_mode
  timezone_us: America/New_York
  timezone_jp: Asia/Tokyo

data:
  source: corrected_bundle
  root: ./data/normalized/corrected_bundle

universe:
  us_core: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY]
  us_extended: [XLC, XLRE]
  jp: [1617.T, 1618.T, 1619.T, 1620.T, 1621.T, 1622.T, 1623.T, 1624.T, 1625.T, 1626.T, 1627.T, 1628.T, 1629.T, 1630.T, 1631.T, 1632.T, 1633.T]

sample:
  enforce_table1_counts: true
  table1_target:
    common_n: 2590
    xlc_n: 1758
    xlre_n: 2409
  sample_filter_source: common_dates_core
  cfull_window_start: 2010-01-01
  cfull_window_end: 2014-12-31

strategy:
  name: pca_sub
  lookback_L: 60
  n_components_K: 3
  prior_dim_K0: 3
  lambda_reg: 0.9
  quantile_q: 0.3
  target_return: jp_open_to_close
  predictor_return: us_same_day_close_to_close
  weighting: equal_weight_long_short

costs:
  commission_bps: 0.0
  open_half_spread_bps: 5.0
  close_half_spread_bps: 5.0
  slippage_open_bps: 3.0
  slippage_close_bps: 3.0
  borrow_fee_bps_annual: 0.0

risk:
  max_gross: 2.0
  max_net: 0.0
  max_single_name_abs: 0.20
  min_tradable_names: 6
  max_expected_cost_bps: 35.0
  halt_on_missing_price: true
  halt_on_unapproved_patch: true
  halt_on_universe_shrinkage: true
  allow_short: false

broker:
  kind: "null"
  paper_sync: false

packet:
  schema_version: 1
  summary_template: default
  include_charts: true
  write_csv: true
  write_json: true
