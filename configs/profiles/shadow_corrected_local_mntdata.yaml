# Same profile, but pre-filled for the current container/session paths.

extends:
  - shadow_corrected.yaml

run:
  name: shadow_corrected_local
  mode: shadow
  runs_root: /mnt/data/leadlag_stack_runs
  logs_root: /mnt/data/leadlag_stack_logs
  historical_trade_date: 2025-11-28
  shadow_nav_jpy: 1000000
  write_daily_packet: true

data:
  source: corrected_bundle
  root: /mnt/data/corrected_bundle_current

risk:
  allow_short: false
  max_gross: 1.0
  max_net: 1.0
  max_single_name_abs: 0.15
  min_tradable_names: 6
  max_expected_cost_bps: 35.0
  hard_gates:
    - missing_price
    - missing_factor
    - no_common_dates
    - unapproved_patch
    - cost_too_high
    - tradable_names_too_few

packet:
  include_charts: true
  write_csv: true
  write_json: true
